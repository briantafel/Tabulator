name: Build temperatures

# Our temperature model for the app (claude/temp-wind-plan.md): hourly ECMWF,
# GEM and GFS from Open-Meteo's forecast API at each resort's mid elevation,
# blended with the weights and high corrections in public/temp-model.json.
# Writes public/temps.json, commits it, redeploys. The app only reads it
# behind the `temps` switch (public/flags.json + Settings → Temperature).
# ~56 Open-Meteo requests a run.

on:
  # scheduled by workers/scheduler (Cloudflare); GitHub cron removed 2026-11-23
  push:
    branches: [main]
    paths: ["scripts/temps/**", "public/temp-model.json", ".github/workflows/temps.yml"]
  workflow_dispatch:

permissions:
  contents: write  # commits public/temps.json (only)
  issues: write    # alert issue on failure
  actions: write   # to redeploy the site after that commit

concurrency:
  group: temps
  cancel-in-progress: false

jobs:
  temps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build public/temps.json
        run: node scripts/temps/build.js public

      - name: Commit temps.json
        id: commit
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/temps.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "temps: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && { echo "pushed=true" >> "$GITHUB_OUTPUT"; break; }
            sleep 10
          done

      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue on failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')   # the Worker starts this via workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\npublic/temps.json (the app's temperature numbers) was not refreshed; the app keeps showing the last good file. The next scheduled run retries.`;
            const { data: existing } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "temps-failure" });
            if (existing.length) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing[0].number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Temperature build failed", body, labels: ["temps-failure"] });
