name: Map style sketch (one-off)

# Design sketch for in-app maps (claude/maps-sketch.md). Manual only; not part of the app.
# Renders a white relief base of the Wasatch with editable vector layers and the latest
# raw ECMWF IFS 5-day snow. Uploads them as a run artifact and force-pushes them to the
# `maps-sketch` branch (a single orphan commit; main and the app are untouched). Nothing in R2.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y -q fonts-inter >/dev/null || true
          pip install rasterio cairosvg scipy matplotlib pillow ecmwf-opendata eccodes eccodeslib
      - name: Render
        run: |
          python3 scripts/maps/sketch.py out/ifs --dem-cache dem.npy --source ifs
          python3 scripts/maps/sketch.py out/nbm --dem-cache dem.npy --source nbm
          python3 scripts/maps/sketch.py out/nbm-terraced --dem-cache dem.npy --source nbm --style terraced
      - uses: actions/upload-artifact@v4
        with:
          name: maps-sketch
          path: out/
          retention-days: 14
      - name: Publish to the maps-sketch branch
        run: |
          cd out
          git init -q -b maps-sketch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Map sketch from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" maps-sketch
