name: Terrain maps refresh (snow-by-terrain, every new forecast run)

# Snow by terrain is a picture of ONE forecast run, so it goes stale the moment a newer run exists, and a stale map next
# to a fresh forecast is a trust problem (Brian, 2026-11-22: Jackson Hole showed 5-18" beside a 1.5" forecast).
#
# This redraws every app resort's map that is older than the newest NOAA NBM run (ECMWF IFS for resorts outside the
# NBM) and publishes them. Archive-only resorts (no sheet in the app, 49 of 106 maps) are skipped: nothing shows them.
# Two waves: the ANCHORED resorts first (their map must equal the sheet's total, so the app hides it until it is
# redrawn: it must not wait behind the rest), then everything else. The second publish waits for the first. The slow part, the Blender relief, does not depend on the forecast, so it is cached in the release
# `terrain-base` and only the snow layers are redrawn: minutes per resort instead of ~40.
#
# Runs after every blend (blend.yml dispatches it). Nothing due -> nothing happens. A map that is not refreshed is
# hidden by the app after 30 h, and a failed resort fails this run red and opens an issue.
#
# Maps are published to the orphan branch `terrain-live` (one commit, force-pushed: ~65 MB of images per refresh would
# bury the repo in history) and pages.yml folds that branch into the site at deploy time.

on:
  workflow_dispatch:
    inputs:
      resorts:
        description: "Space-separated resort ids (empty = every map that is older than the newest run)"
        default: ""
      force:
        description: "Redraw the listed (or all) maps even if they are already from the newest run"
        type: boolean
        default: false
      anchor:
        description: "Resort ids to anchor to the sheet (empty = the list in ANCHOR_RESORTS below). Used to try resorts before they join the list."
        default: ""

# Resorts whose map totals are anchored to the sheet's forecast (scripts/maps/anchor.py; Brian 2026-11-22). Jackson Hole
# first; the rest join once it is checked. Anchored maps are redrawn every refresh and read public/forecast.json and
# public/blend-forecast.json from this checkout of main (blend.yml pushes them before it dispatches this).
env:
  ANCHOR_RESORTS: ${{ inputs.anchor || 'jackson-hole' }}

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: terrain-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix_first: ${{ steps.p.outputs.matrix_first }}
      count_first: ${{ steps.p.outputs.count_first }}
      matrix_rest: ${{ steps.p.outputs.matrix_rest }}
      count_rest: ${{ steps.p.outputs.count_rest }}
      count: ${{ steps.p.outputs.count }}
      cycle: ${{ steps.p.outputs.cycle }}
      anchor: ${{ steps.p.outputs.anchor }}
    env:
      GH_TOKEN: ${{ github.token }}
      ONLY: ${{ inputs.resorts }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install (the NBM bucket reader needs numpy and eccodes)
        run: pip install numpy eccodes eccodeslib
      - name: Live index
        run: |
          if git ls-remote --exit-code --heads origin terrain-live >/dev/null 2>&1; then
            git fetch -q --depth 1 origin terrain-live
            git show FETCH_HEAD:index.json > index.json
            echo "index from terrain-live"
          else
            cp public/terrain/index.json index.json
            echo "index from main (no terrain-live branch yet)"
          fi
      - name: Relief cache release
        run: |
          gh release view terrain-base >/dev/null 2>&1 || \
            gh release create terrain-base --target "$GITHUB_SHA" --latest=false --title "terrain-base" \
              --notes "Cached Blender reliefs (they do not depend on the forecast) so a forecast refresh redraws only the snow. Written by terrain-refresh.yml."
      - id: p
        run: |
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ -n "$ONLY" ] && args+=(--only $ONLY)
          python3 scripts/maps/refresh_plan.py index.json "${args[@]}"
          echo "anchor=$ANCHOR_RESORTS" >> "$GITHUB_OUTPUT"

  render-first:
    needs: plan
    if: needs.plan.outputs.count_first != '0'
    uses: ./.github/workflows/terrain-render.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix_first }}
      prefix: stage-first
      anchor: ${{ needs.plan.outputs.anchor }}

  render-rest:
    needs: plan
    if: needs.plan.outputs.count_rest != '0'
    uses: ./.github/workflows/terrain-render.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix_rest }}
      prefix: stage-rest
      anchor: ${{ needs.plan.outputs.anchor }}

  publish-first:
    needs: [plan, render-first]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count_first != '0'
    uses: ./.github/workflows/terrain-publish.yml
    with:
      prefix: stage-first
      cycle: ${{ needs.plan.outputs.cycle }}
      render-result: ${{ needs.render-first.result }}

  # Starts only after publish-first has finished (success or not): both force-push terrain-live, and the second must
  # build on what the first pushed, never on the branch as it was before.
  publish-rest:
    needs: [plan, render-rest, publish-first]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count_rest != '0' && needs.publish-first.result != 'cancelled'
    uses: ./.github/workflows/terrain-publish.yml
    with:
      prefix: stage-rest
      cycle: ${{ needs.plan.outputs.cycle }}
      render-result: ${{ needs.render-rest.result }}
