name: Ensemble history from dynamical.org (one-time, self-paced)

# Added 2026-11-11 (Brian: "do what you need to do"). Loads past northern
# winters (Nov–Apr) of ECMWF IFS ENS (from 2024), NOAA GEFS (from 2020) and
# ECMWF AIFS ENS (from 2025) at our resort points. That is ~2,200 inits and
# ~18 runner-hours, done in 50-minute chunks, one an hour. Done markers make
# every chunk skip what is already archived, so it simply picks up where the
# last one stopped. When the summary says HISTORY COMPLETE, each run is a
# ~1-minute no-op and this workflow can be disabled or deleted.
on:
  # scheduled by workers/scheduler (Cloudflare); GitHub cron removed 2026-11-23
  workflow_dispatch:

permissions:
  contents: read
  issues: write    # alert issue on failure

concurrency:
  group: dynamical-history
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install dynamical-catalog numpy duckdb==2.0.0
      - name: Load the next chunk of history
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 scripts/archive/dynamical_ens.py work history
          # Resorts added after the history load finished (src/data/history-refill.json).
          # Remove an id once its run summary says HISTORY COMPLETE for it.
          refill=$(python3 -c "import json;print(','.join(json.load(open('src/data/history-refill.json'))))")
          if [ -n "$refill" ]; then python3 scripts/archive/dynamical_ens.py work history --resorts "$refill"; fi

      - name: Open an issue on failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')   # the Worker starts this via workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\nThe hourly history load for the dynamical.org ensemble did not finish. Nothing is lost: it resumes from its done markers on the next run.`;
            const { data: existing } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "dynamical-history-failure" });
            if (existing.length) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing[0].number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: "Dynamical history load failed", body, labels: ["dynamical-history-failure"] });
