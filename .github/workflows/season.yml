name: Build season to date

# The "Shaping up" numbers for trips past the forecast
# (claude/calendar-shaping-up-plan.md): per US resort, snowpack vs the
# 1991–2020 median, recent snow, and what the surface has been through, from
# NRCS SNOTEL (public). Writes public/season.json, commits it, redeploys.
# The app only reads it behind the `season` switch. ~5 AWDB requests a run.

on:
  # scheduled by workers/scheduler (Cloudflare); GitHub cron removed 2026-11-23
  push:
    branches: [main]
    paths: ["scripts/season/**", ".github/workflows/season.yml"]
  workflow_dispatch:

permissions:
  contents: write  # commits public/season.json (only)
  actions: write   # to redeploy the site after that commit

concurrency:
  group: season
  cancel-in-progress: false

jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build public/season.json
        run: node scripts/season/build.js public

      - name: Commit season.json
        id: commit
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/season.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "season: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Two builds can overlap (a push and a dispatch a few seconds apart).
          # Both write season.json; on a conflict ours is the newer build, so
          # it wins (-X theirs = the commit being replayed). A push that never
          # lands fails the run: failures must be loud.
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q origin main && git push; then pushed=true; echo "pushed=true" >> "$GITHUB_OUTPUT"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$pushed" != true ]; then echo "::error::season.json was built but never pushed"; exit 1; fi

      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
