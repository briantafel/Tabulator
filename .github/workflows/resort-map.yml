name: Resort snow-by-terrain map (one-off)

# One resort, its ski area alone, NBM downscaled by terrain on plaster relief.
# Manual. Publishes PNG/SVG/JSON to the `resort-maps` branch.
on:
  workflow_dispatch:
    inputs:
      resorts: {default: "alta"}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install
        run: |
          sudo apt-get install -y -q fonts-inter >/dev/null || true
          pip install ijson rasterio cairosvg scipy matplotlib pillow eccodes eccodeslib
      - name: Blender (top-down plaster relief)
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 >/dev/null || echo "apt install failed"
          f=Blender4.2/blender-4.2.3-linux-x64.tar.xz
          for u in https://download.blender.org/release/$f https://mirrors.ocf.berkeley.edu/blender/release/$f https://ftp.nluug.nl/pub/graphics/blender/release/$f; do
            curl -fsSL --retry 4 --retry-delay 10 -o b.tar.xz "$u" && xz -t b.tar.xz && break
            echo "download failed from $u"; rm -f b.tar.xz
          done
          tar -xf b.tar.xz
          echo "BLENDER=$PWD/blender-4.2.3-linux-x64/blender" >> $GITHUB_ENV
      - name: OpenSkiMap exports
        run: |
          mkdir -p osm
          for k in ski_areas lifts runs; do
            curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -o osm/$k.geojson https://tiles.openskimap.org/geojson/$k.geojson
            ls -la osm/$k.geojson
          done
      - name: Render
        env:
          OSM_DIR: osm
        run: for r in ${{ inputs.resorts }}; do python3 scripts/maps/resort_map.py out $r; done
      - name: Publish to the resort-maps branch
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b resort-maps
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resort maps from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resort-maps
