name: What fell yesterday (print only)

# 2026-11-19: fetch the last few days of public observations (SNOTEL daily,
# CoCoRaHS, resort-reported new snow) and print them to the log, so a session
# can check a forecast against what fell without waiting for the archive or
# the sealed report. Nothing is uploaded; nothing paid is fetched.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/verify/yesterday.js
