name: Ensembles from dynamical.org (ECMWF, GEFS, AIFS)

# Added 2026-11-11 (claude/lean-data-plan.md, Phase 1). ECMWF IFS ENS, NOAA
# GEFS and ECMWF AIFS ENS at our resort points, read from dynamical.org's free
# Icechunk/Zarr copies on AWS (CC BY 4.0 + ECMWF terms). No Open-Meteo calls.
# First cut: manual runs only, starting with mode=probe to learn the datasets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (print dataset facts only)"
        type: choice
        options: [probe]
        default: probe

permissions:
  contents: read

concurrency:
  group: dynamical-ens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install dynamical-catalog numpy duckdb==2.0.0
      - name: Probe
        if: inputs.mode == 'probe'
        run: python3 scripts/archive/dynamical_probe.py
