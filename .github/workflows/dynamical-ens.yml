name: Ensembles from dynamical.org (ECMWF, GEFS, AIFS)

# Added 2026-11-11 (claude/lean-data-plan.md, Phase 1). ECMWF IFS ENS, NOAA
# GEFS and ECMWF AIFS ENS at our resort points, read from dynamical.org's free
# Icechunk/Zarr copies on AWS (CC BY 4.0 + ECMWF terms). No Open-Meteo calls,
# so no quota. Every 3 hours it archives each init not yet archived (done
# markers under dynamical/done/), so late or skipped runs lose nothing.
#
# Manual modes: probe (print dataset facts), dry (build rows, upload nothing),
# live (what the schedule runs), backfill (from/to dates; history).
on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [live, dry, probe, backfill]
        default: live
      only:
        description: "One model only: ecmwf_ifs_ens, gefs or ecmwf_aifs_ens"
        type: string
        default: ""
      from:
        description: "backfill: first init (YYYY-MM-DD)"
        type: string
        default: ""
      to:
        description: "backfill: last init (YYYY-MM-DD)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: dynamical-ens
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the script stops starting new inits at 50 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install dynamical-catalog numpy duckdb==2.0.0
      - name: Probe
        if: inputs.mode == 'probe'
        run: python3 scripts/archive/dynamical_probe.py
      - name: Collect
        if: inputs.mode != 'probe'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          MODE: ${{ inputs.mode || 'live' }}
          ONLY: ${{ inputs.only }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          args=(work)
          case "$MODE" in
            live) args+=(live) ;;
            dry) args+=(live --dry-run) ;;
            backfill) args+=(backfill "$FROM" "$TO") ;;
          esac
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          python3 scripts/archive/dynamical_ens.py "${args[@]}"
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\nThe dynamical.org ensemble collection failed. dynamical.org keeps its history, so nothing is lost yet; the next run retries every init not archived. The run summary says which init failed and why.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "dynamical-failure" });
            if (existing.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: "dynamical.org ensemble collection failed", body, labels: ["dynamical-failure"] });
            }
