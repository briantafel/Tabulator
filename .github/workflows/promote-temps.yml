name: Promote judged models (temperature, SLR)

# Copies the judged temperature model from the latest verify run (private
# bucket, verify/latest/temp-model.json) into public/temp-model.json, keeping
# ONLY the var × lead combinations the judge winter promoted
# (scripts/model/promote_temps.py). The file holds public-model weights and
# per-resort biases fitted against SNOTEL — nothing paid. The commit triggers
# temps.yml, which rebuilds public/temps.json and redeploys. Manual on purpose:
# Brian approves a promotion (2026-11-15: "do it all").
#
# Also SLR v2 (scripts/model/slr.py, same-station new snow + water; public truth
# only): public/slr.json is written ONLY if every judged lead was promoted.
# scripts/projections/build_dyn.py reads it in place of its stated prior.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # a GITHUB_TOKEN push doesn't trigger temps.yml, so it is started explicitly

concurrency:
  group: temps
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the judged model
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://$R2_BUCKET/verify/latest/temp-model.json" /tmp/temp-model.json --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/verify/latest/slr.json" /tmp/slr.json --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/verify/latest/blend.json" /tmp/blend.json --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/verify/latest/bands.json" /tmp/bands.json --endpoint-url "$ENDPOINT" --only-show-errors || echo "no bands.json yet"
          aws s3 cp "s3://$R2_BUCKET/verify/latest/temps_report.md" /tmp/temps_report.md --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "s3://$R2_BUCKET/verify/latest/slr_report.md" /tmp/slr_report.md --endpoint-url "$ENDPOINT" --only-show-errors
      - name: Show the public-data judgement (no paid rows)
        run: |
          # temps_report.md is public models vs SNOTEL only. slr_report.md is cut BEFORE its Snow-Forecast section.
          cat /tmp/temps_report.md | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import sys;t=open('/tmp/slr_report.md').read();print(t.split('## Ours (ECMWF water')[0].replace('PRIVATE (contains paid-source comparison).',''))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep promoted parts only
        run: python3 scripts/model/promote_temps.py /tmp/temp-model.json public/temp-model.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: SLR — ship only if promoted at every judged lead
        run: |
          python3 - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("/tmp/slr.json"))
          prom = p.get("promote") or {}
          if p.get("version") not in ("slr-v2", "slr-v3") or not prom:
              print(f"SLR: {p.get('version')} has no per-lead judgement — not shipped")
          elif all(prom.values()):
              keep = {k: p[k] for k in ("version", "form", "a", "b", "clamp", "temperature", "fitted_on", "n_days",
                                        "median_observed_slr", "promote", "regions", "region_of") if k in p}
              json.dump(keep, open("public/slr.json", "w"), indent=2); open("public/slr.json", "a").write("\n")
              own = {r: f"{e['a']} + {e['b']}·T" for r, e in (p.get("regions") or {}).items() if e.get("promoted")}
              print(f"SLR: shipped {p['version']}: pooled SLR = {p['a']} + {p['b']}·T (promoted at every lead); "
                    f"own regional lines: {own or 'none'}")
          else:
              print(f"SLR: NOT shipped — promoted leads {sorted(k for k, v in prom.items() if v)} of {sorted(prom)}")
          PY
      # Bands v1 (2026-11-18): ship only if every lead group's coverage passed.
      # Revert: flags.json "bands": "off" (the app goes back to the ensemble-spread band).
      - name: Bands — ship only if calibrated
        run: |
          python3 - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("/tmp/bands.json"):
              print("Bands: no judged file in verify/latest yet — not shipped")
          else:
              b = json.load(open("/tmp/bands.json"))
              rows = {r["group"]: r for r in b.get("coverage", [])}
              cov = ", ".join(f"{g}: likely {r['likely']:.0%}, possible {r['possible']:.0%}" for g, r in rows.items())
              if b.get("version") == "bands-v1" and b.get("promote") is True:
                  json.dump(b, open("public/bands.json", "w"), indent=2); open("public/bands.json", "a").write("\n")
                  print(f"Bands: shipped bands-v1 ({cov})")
              else:
                  print(f"Bands: NOT shipped — coverage outside ±{b.get('tolerance', 0):.0%} of target ({cov})")
          PY

      - name: Blend — ship the judged water blend (public models only)
        run: |
          python3 - <<'PY' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("/tmp/blend.json"))
          need = ("weights", "factors", "pooled_factors")
          if not all(p.get(k) for k in need):
              raise SystemExit("blend.json has no weights/factors — not shipped")
          keep = {k: p[k] for k in ("version", "models", "leads", "weights", "factors", "pooled_factors",
                                    "best_single_on_train", "fitted_on") if k in p}
          keep.setdefault("version", "blend-v1")
          json.dump(keep, open("public/blend.json", "w"), indent=1); open("public/blend.json", "a").write("\n")
          print(f"Blend: shipped {keep['version']} ({len(keep['factors'])} region factors, leads {sorted(keep['weights'])})")
          PY
      - name: Commit
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/temp-model.json public/slr.json public/blend.json
          if [ -f public/bands.json ]; then git add public/bands.json; fi
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "models: promote judged temperature / SLR from verify/latest"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
      - name: Rebuild temperatures with the promoted model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run temps.yml --ref main
          # Our forecast picks up new bands (or blend weights) on its next build; start one now.
          gh workflow run blend.yml --ref main
