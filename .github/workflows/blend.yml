name: Our forecast (live blend, once a day)
# 2026-11-16 (Brian). Fetches today's ECMWF / GFS / GEM from Open-Meteo's
# forecast API (one request per app resort, all three models: ~56 calls,
# paced 10 s apart, ~10 min), archives them exactly as fetched, and builds
# public/blend-forecast.json: blend-v1 water x our snow-to-liquid ratio
# (scripts/blend). The app draws it as a light mark on days 1-6.
# Started by the Cloudflare scheduler at 07:07 UTC, an hour before the
# Open-Meteo ensemble pass, so the two never overlap.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: blend
  cancel-in-progress: false

jobs:
  blend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==2.0.0

      - name: Check the bucket secrets are set
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Collect (paced)
        id: collect
        continue-on-error: true
        env:
          ONLY_SOURCES: open-meteo-forecast
          OM_DELAY_MS: "10000"
        run: node scripts/archive/collect.js out

      # Fails (red) and writes nothing when under 90 % of resorts: the app
      # then keeps yesterday's file, which it ignores once it is stale.
      - name: Build our forecast
        id: projections
        continue-on-error: true
        run: node scripts/blend/build.js out public

      - name: Commit our forecast
        id: projcommit
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/blend-forecast.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "blend-forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && { echo "pushed=true" >> "$GITHUB_OUTPUT"; break; }
            sleep 10
          done

      - name: Redeploy the site
        if: steps.projcommit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Package raw files and Parquet
        run: |
          test -f out/manifest.json || { echo "::error::collect.js wrote no manifest"; exit 1; }
          RUN_ID=$(jq -r .runId out/manifest.json)
          DATE=${RUN_ID:0:10}
          MONTH=${RUN_ID:0:7}
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          mkdir -p up/runs
          python3 scripts/archive/to_parquet.py out/rows up/archive "$RUN_ID" "$MONTH"
          for dir in out/raw/*/; do
            [ -d "$dir" ] || continue
            src=$(basename "$dir")
            mkdir -p "up/raw/source=$src/date=$DATE"
            tar -cf "up/raw/source=$src/date=$DATE/$RUN_ID.tar" -C "$dir" .
          done
          cp out/manifest.json "up/runs/$RUN_ID.json"
          du -sh up/*

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp up "s3://$R2_BUCKET/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 ls "s3://$R2_BUCKET/runs/$RUN_ID.json" --endpoint-url "$ENDPOINT"

      - name: Fail the run if the pass or the projections fell short
        if: steps.collect.outcome == 'failure' || steps.projections.outcome == 'failure'
        run: |
          [ "${{ steps.collect.outcome }}" = "failure" ] && echo "::error::Open-Meteo forecast pass fell short — see the Collect step. What succeeded was still uploaded."
          [ "${{ steps.projections.outcome }}" = "failure" ] && echo "::error::Our forecast was not built — see the Build our forecast step."
          exit 1

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Our forecast (live blend) fell short";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            const existing = open.data.find((i) => i.title === title);
            const body = `Run: ${runUrl}\n\nThe gray mark on days 1–6 comes from this pass. Without it the app shows Snow-Forecast alone.`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
