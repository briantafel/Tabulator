name: Terrain publish (reusable, called by terrain-refresh.yml)

# Folds the maps in the artifacts `<prefix>-*` into the live folder, force-pushes the orphan branch `terrain-live`
# and redeploys the site. Always starts from what terrain-live holds NOW, so the second wave never undoes the first.

on:
  workflow_call:
    inputs:
      prefix:
        type: string
        required: true
      cycle:
        type: string
        required: true
      render-result:
        description: "result of the render job this publishes (success / failure / skipped / cancelled)"
        type: string
        required: true

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.prefix }}-*
          path: stage
      - name: Fold the new maps into the live folder
        id: pub
        run: |
          mkdir live
          if git ls-remote --exit-code --heads origin terrain-live >/dev/null 2>&1; then
            git fetch -q --depth 1 origin terrain-live
            git archive FETCH_HEAD | tar -x -C live
          else
            cp -r public/terrain/. live/
          fi
          rc=0
          python3 scripts/maps/refresh_publish.py live stage --also public/terrain || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Publish whatever was good even when some resorts failed: stale maps hide themselves after 30 h, and the
          # failure below is loud.
          cd live
          git init -q -b terrain-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Terrain maps from NBM ${{ inputs.cycle }} (${{ inputs.prefix }}, run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" terrain-live
          exit 0
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Loud failure
        if: always() && (inputs.render-result != 'success' || steps.pub.outputs.rc != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const failed = (fs.existsSync("stage") ? fs.readdirSync("stage", { recursive: true }) : [])
              .filter((f) => /FAILED-\d+\.txt$/.test(f))
              .map((f) => fs.readFileSync(`stage/${f}`, "utf8").trim()).filter(Boolean).join(" ");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Terrain maps: refresh fell short";
            const body = `Run: ${runUrl}\n\nRender result (${{ inputs.prefix }}): ${{ inputs.render-result }}; publish rc: ${{ steps.pub.outputs.rc }}.\nResorts that failed to redraw: ${failed || "(see the run)"}\n\nThose maps keep their old snow and the app hides any map older than 30 h.`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            const existing = open.data.find((i) => i.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
            core.setFailed("some terrain maps were not refreshed");
