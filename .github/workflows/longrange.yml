name: Long-range odds (calibrated chance of a big storm)

# 2026-11-22 (Brian): odds, not inches, for the days past the last inch the app shows. The chance of
# 72 h of liquid water >= 25 mm from the live GEFS, corrected with the leave-one-winter-out fit that
# scripts/model/promote_longrange.py copies into public/longrange-calib.json (only leads that beat
# climatology on held-out winters). No calibration promoted yet: this job writes nothing and says so.
# Writes public/longrange.json. The app reads it behind flags.json "longRange".
# See scripts/longrange/build.py.
#
# 10:27 UTC: after projections-dyn.yml (10:07), same day's GEFS 00z.
on:
  # scheduled by workers/scheduler (Cloudflare); GitHub cron removed 2026-11-23
  workflow_dispatch:

permissions:
  contents: write  # commits public/longrange.json (only)
  issues: write
  actions: write   # to redeploy the site after that commit

concurrency:
  group: longrange
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dynamical.org reader
        run: pip install dynamical-catalog numpy
      - name: Test
        run: |
          python3 scripts/longrange/test_build.py
          python3 scripts/model/test_promote_longrange.py
      - name: Build
        id: build
        run: python3 scripts/longrange/build.py public 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: Commit
        id: commit
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          test -f public/longrange.json || { echo "nothing written"; exit 0; }
          git add public/longrange.json
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "longrange: $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push that never lands fails the run: failures must be loud (was a silent 3-try loop).
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push; then pushed=true; echo "pushed=true" >> "$GITHUB_OUTPUT"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          if [ "$pushed" != true ]; then echo "::error::longrange.json was built but never pushed"; exit 1; fi
      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Open an issue on failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')   # the Worker starts these via workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Long-range odds failed or fell short";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            const existing = open.data.find((i) => i.title === title);
            const body = `Run: ${runUrl}`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
