name: Resort elevations (one-off)

# Base/summit elevations per resort from OpenSkiMap. Manual. Publishes the table and a
# match report to the `resort-elevations` branch for review; nothing in main changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 scripts/data/resort_elevations.py out
      - name: Publish to the resort-elevations branch
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b resort-elevations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Resort elevations from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resort-elevations
