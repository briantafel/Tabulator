name: More models (HRRR precipitation, Canada HRDPS, NOAA AIGEFS)

# Added 2026-11-18 (claude/state-2026-11-18-more-models.md). Brian compared our
# model list with OpenSnow's; these were the gaps worth closing. 6 h blocks of
# precipitation (+ HRRR snow, + hourly-model temp/wind extremes) at resort
# points, same rows as NBM. HRDPS lives ~1 day on the MSC Datamart, so this
# runs every hour (GitHub cron runs late; done markers make extra runs cheap).
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
      only:
        description: "One model only: hrrr, hrdps or aigefs (optional)"
        type: string
        default: ""
      cycle:
        description: "One cycle only, YYYYMMDDHH (optional; HRRR backfill)"
        type: string
        default: ""
      probe:
        description: "Only print the AIGEFS file layout on NOMADS"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ (inputs.dry_run || inputs.probe) && format('extra-models-dry-{0}', inputs.only) || 'extra-models-live' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install eccodes eccodeslib numpy duckdb==2.0.0 pytest
      - name: Test
        run: python3 -m pytest -q scripts/archive/test_extra_models.py scripts/archive/test_upper_air.py
      - name: Collect
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DRY: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
          CYCLE: ${{ inputs.cycle }}
          PROBE: ${{ inputs.probe }}
        run: |
          args=(work)
          [ "$PROBE" = "true" ] && args+=(--probe)
          [ "$DRY" = "true" ] && args+=(--dry-run)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$CYCLE" ] && args+=(--cycle "$CYCLE")
          python3 scripts/archive/extra_models.py "${args[@]}"
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\nCollection of HRRR precipitation / HRDPS / AIGEFS failed. HRRR stays on AWS, but the HRDPS Datamart keeps only about a day, so a failure that lasts loses HRDPS data. The summary says which model and cycle failed and why.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "extra-models-failure" });
            if (existing.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: "Extra model collection failed (HRRR precip, HRDPS, AIGEFS)", body, labels: ["extra-models-failure"] });
            }
