name: Check NBM stored zeros at interior Canada resorts, backfilled winters (read-only, no app change)

# 2026-11-25: follow-up to interior-models-check (inconclusive). Rule fixed in the docstring of scripts/diag/nbm_interior_zero.py
# before the run. Scores NBM (public) paired with observations in verify's pairs table; report to verify/latest/.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: strict (default) or loose (pair quality strict or loose, station within 40 km; rule amendment in the script docstring)
        default: strict

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install duckdb==2.0.0 "numpy>=2,<3" pandas pyarrow pytz
      - name: Test on synthetic pairs
        run: python3 scripts/diag/test_nbm_interior_zero.py > /dev/null
      - name: Fetch pairs from the latest verify run
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://$R2_BUCKET/verify/latest/pairs.parquet" /tmp/pairs.parquet --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3api head-object --bucket "$R2_BUCKET" --key verify/latest/pairs.parquet --endpoint-url "$ENDPOINT" \
            --query '{last_modified: LastModified, bytes: ContentLength}' --output text | sed "s|^|pairs.parquet |"
      - name: Check
        run: python3 scripts/diag/nbm_interior_zero.py /tmp/pairs.parquet out ${{ github.event.inputs.mode == 'loose' && 'loose' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Refuse if the report names a paid source
        run: |
          if grep -qi "snow-forecast" out/*; then echo "::error::report names a paid source"; exit 1; fi
      - name: Save
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp out/ "s3://$R2_BUCKET/verify/latest/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
