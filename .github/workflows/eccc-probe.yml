name: Probe Environment Canada API (one-off, no app change)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: set -o pipefail; node scripts/archive/eccc-probe.js | tee -a "$GITHUB_STEP_SUMMARY"
