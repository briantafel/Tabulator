name: Fetch forecast

# PAUSED 2026-08-25, at Brian's request: the app is running on the sample
# fixture while the UI is being built, so a twice-daily scrape fetches pages
# nobody reads. That is bandwidth spent for nothing and, worse, a steady
# unattended request pattern is exactly what gets a scraper's IP flagged —
# and Snow-Forecast is the one source this app cannot replace.
#
# Re-enable by uncommenting the two schedule lines. workflow_dispatch is left
# on so a run can still be triggered by hand from the Actions tab whenever a
# real dataset is wanted.
on:
  # schedule:
  #   - cron: "15 6 * * *"    # 06:15 UTC
  #   - cron: "15 18 * * *"   # 18:15 UTC
  workflow_dispatch:         # so you can trigger it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Scrape
        run: npm run scrape

      - name: Commit if changed
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/forecast.json public/history.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # The scrape step already exits non-zero when too few resorts parse, so a
      # broken run goes red rather than silently committing an empty file.
      # This surfaces it as a tracked issue too, because a red Action on a
      # schedule is easy to never look at.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Every line of this script must stay indented inside the block
            // scalar. A template literal whose continuation lines sit at
            // column 0 silently invalidates the whole workflow file — which
            // is exactly how this step broke five runs before it ever ran.
            const runUrl = [
              context.serverUrl,
              context.repo.owner,
              context.repo.repo,
              "actions/runs",
              context.runId,
            ].join("/");
            const body = [
              "Run: " + runUrl,
              "",
              "Most likely causes, in order:",
              "1. A resort slug changed - check `src/data/resorts.json`.",
              "2. Snow-Forecast changed the `data-row` attributes the parser targets.",
              "3. Requests blocked from GitHub's IP ranges - run `npm run scrape`",
              "   locally to compare. If local works and CI does not, move the",
              "   schedule to a machine on a residential connection.",
            ].join("\n");
            const title = "Forecast scrape failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scrape-failure",
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scrape-failure"],
              });
            }
