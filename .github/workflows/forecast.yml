name: Fetch forecast

# Live again 2026-10-28 (paused 2026-08-25 while the UI was built on sample
# data). Twice a day it scrapes Snow-Forecast and OnTheSnow, fetches the NWS
# forecast for the US resorts, commits whatever
# changed, and redeploys the site — a commit made by this workflow's own token
# does NOT trigger pages.yml on its own, so the deploy is kicked explicitly.
on:
  schedule:
    - cron: "15 6 * * *"    # 06:15 UTC
    - cron: "15 21 * * *"   # 21:15 UTC — after WPC/CPC afternoon discussions (~3–4 PM ET)
  workflow_dispatch:         # so you can trigger it by hand from the Actions tab

permissions:
  contents: write
  actions: write   # to start the Pages deploy after a data commit

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Scrape forecast
        run: npm run scrape

      # Skier reports are secondary: a failure here must not cost the forecast
      # its commit. continue-on-error lets the job reach the commit, the reports
      # file is put back so a failed run never ships an emptier feed, and the
      # last step turns the run red so the failure is still loud.
      - name: Scrape skier reports
        id: reports
        continue-on-error: true
        run: npm run scrape:reports

      - name: Keep the previous reports if that scrape failed
        if: steps.reports.outcome == 'failure'
        run: git checkout -- public/reports.json

      # The NWS row in the resort sheet. The forecast still commits if this
      # fails, and the run goes red at the end. The script itself decides
      # whether to write: it keeps the last good file when NWS is down, and
      # writes the rest when only a point or two failed.
      - name: Fetch NWS weather
        id: weather
        continue-on-error: true
        run: npm run weather

      # The radar read-out (claude/radar-readout-spec.md). Written from this
      # run's forecast and weather so it commits alongside them. Uses the
      # Claude API when the ANTHROPIC_API_KEY secret exists, the template
      # otherwise; the script caps API calls per run and per day itself.
      # Failure here never costs the forecast its commit — the app hides a
      # read-out whose forecast stamp does not match the radar's.
      - name: Write the radar read-out
        id: readout
        continue-on-error: true
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A Sonnet version of each read-out, saved to the artifact only,
          # for Brian to compare with Haiku. Delete this line to stop it.
          READOUT_COMPARE_UNTIL: "2026-11-08"
        run: npm run readout

      - name: Keep what the read-out was given and wrote
        if: always() && steps.readout.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: readout-debug
          path: readout-debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/forecast.json public/history.json public/reports.json public/weather.json public/editorial.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Fail the run if the reports, weather or read-out failed
        if: steps.reports.outcome == 'failure' || steps.weather.outcome == 'failure' || steps.readout.outcome == 'failure'
        run: |
          if [ "${{ steps.reports.outcome }}" = "failure" ]; then
            echo "::error::Skier reports scrape failed — forecast was still committed; reports.json kept from the last good run."
          fi
          if [ "${{ steps.weather.outcome }}" = "failure" ]; then
            echo "::error::NWS weather fetch failed — forecast was still committed; see the Fetch NWS weather step for which resorts."
          fi
          if [ "${{ steps.readout.outcome }}" = "failure" ]; then
            echo "::error::Radar read-out step failed — forecast was still committed; see the Write the radar read-out step (an expired API key or a used-up spend limit says so there)."
          fi
          exit 1

      # The scrape step already exits non-zero when too few resorts parse, so a
      # broken run goes red rather than silently committing an empty file.
      # This surfaces it as a tracked issue too, because a red Action on a
      # schedule is easy to never look at.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Every line of this script must stay indented inside the block
            // scalar. A template literal whose continuation lines sit at
            // column 0 silently invalidates the whole workflow file — which
            // is exactly how this step broke five runs before it ever ran.
            const runUrl = [
              context.serverUrl,
              context.repo.owner,
              context.repo.repo,
              "actions/runs",
              context.runId,
            ].join("/");
            const body = [
              "Run: " + runUrl,
              "",
              "Most likely causes, in order:",
              "1. A resort slug changed - check `src/data/resorts.json`.",
              "2. Snow-Forecast changed the `data-row` attributes the parser targets.",
              "3. Requests blocked from GitHub's IP ranges - run `npm run scrape`",
              "   locally to compare. If local works and CI does not, move the",
              "   schedule to a machine on a residential connection.",
            ].join("\n");
            const title = "Forecast scrape failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "scrape-failure",
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["scrape-failure"],
              });
            }
