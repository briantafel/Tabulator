name: Fetch forecast

# Twice daily. Snow-Forecast updates a few times a day; more often than this
# is impolite and buys nothing for a trip-planning tool.
on:
  schedule:
    - cron: "15 6 * * *"    # 06:15 UTC
    - cron: "15 18 * * *"   # 18:15 UTC
  workflow_dispatch:         # so you can trigger it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Scrape
        run: npm run scrape

      - name: Commit if changed
        run: |
          git config user.name  "tabulator-bot"
          git config user.email "actions@github.com"
          git add public/forecast.json public/history.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # The scrape step already exits non-zero when too few resorts parse, so a
      # broken run goes red rather than silently committing an empty file.
      # This surfaces it as a tracked issue too, because a red Action on a
      # schedule is easy to never look at.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Forecast scrape failed";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "scrape-failure"
            });
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

Most likely causes, in order:
1. A resort slug changed — check \`src/data/resorts.json\`.
2. Snow-Forecast changed the \`data-row\` attributes the parser targets.
3. Requests are being blocked from GitHub's IP ranges — run the scrape locally to compare.`;
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["scrape-failure"] });
            }
