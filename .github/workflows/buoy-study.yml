name: Buoy study (Powder Buoy test)

# Added 2026-11-15 (Brian: "Powder Buoy … great and dead accurate"). Does a
# swell "pop" at NOAA buoy 51101 predict a storm in our mountains about two
# weeks later? Scores the public buoy record against SNOTEL; see
# scripts/research/buoy-stats.js for the pre-registered test. Research only:
# nothing is committed, uploaded to the archive, or shown in the app. The
# report is this run's summary page and the buoy-study artifact.
on:
  workflow_dispatch:
    inputs:
      buoy:
        description: "NDBC buoy: 51101 (NW of Kauai) or 51001 (Hawaii Buoy One, Ruzek's original)"
        type: choice
        options: ["51101", "51001"]
        default: "51101"
      compare:
        description: "Optional second buoy for the overlap section (e.g. 51101)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/research/buoy-study.js
        env:
          BUOY: ${{ inputs.buoy }}
          COMPARE: ${{ inputs.compare }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buoy-study-${{ inputs.buoy }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
