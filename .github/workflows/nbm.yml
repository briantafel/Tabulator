name: NOAA National Blend of Models (US baseline)

# Added 2026-11-11 (claude/lean-data-plan.md, Phase 1). NBM CONUS at our
# resort points from NOAA's free AWS bucket (byte ranges from each file's
# .idx; no Open-Meteo). Every 3 hours it archives each 00z/12z cycle from
# the last 3 days not yet archived (markers under nbm/done/). NOAA keeps
# NBM on AWS long term, so late or skipped runs lose nothing.
on:
  schedule:
    - cron: "35 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
      cycle:
        description: "One cycle only, YYYYMMDDHH (optional)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: nbm
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install eccodes eccodeslib numpy duckdb==2.0.0
      - name: Collect
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DRY: ${{ inputs.dry_run }}
          CYCLE: ${{ inputs.cycle }}
        run: |
          args=(work)
          [ "$DRY" = "true" ] && args+=(--dry-run)
          [ -n "$CYCLE" ] && args+=(--cycle "$CYCLE")
          python3 scripts/archive/nbm.py "${args[@]}"
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\nNBM collection failed. NOAA keeps NBM on AWS, so nothing is lost yet; the next run retries. The summary says which cycle failed and why.`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nbm-failure" });
            if (existing.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: "NBM collection failed", body, labels: ["nbm-failure"] });
            }
