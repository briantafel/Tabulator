name: NBM history backfill (00z/12z, Nov 2024 - Apr 2026)

# Added 2026-11-24 (plan-near-term-models, step 3). Backfills NBM 00z/12z from noaa-nbm-grib2-pds with the live collector
# (scripts/archive/nbm.py --range, parser nbm-3), rows tagged by run_id bf-nbm-<cycle>-<run>. One range per dispatch; each
# 50-minute chunk starts the next chunk of the SAME range until the log says BACKFILL COMPLETE (a failure stops the chain
# and opens an issue). Different ranges run side by side (concurrency is per range). Dispatch with
#   gh api -X POST repos/briantafel/tabulator/actions/workflows/nbm-backfill.yml/dispatches -f ref=main \
#     -f 'inputs[range]=20260101-20260131'
# Reads nothing but NOAA's bucket; writes only archive/source=nbm and nbm/done/ markers. Safe to re-dispatch (markers).
on:
  workflow_dispatch:
    inputs:
      range:
        description: "Days, YYYYMMDD-YYYYMMDD[,…]"
        type: string
        required: true
      hours:
        description: "Cycle hours"
        type: string
        default: "0,12"

permissions:
  contents: read
  actions: write   # to start the next chunk
  issues: write

concurrency:
  group: nbm-backfill-${{ inputs.range }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install eccodes eccodeslib numpy duckdb==2.0.0 pytest
      - name: Tests
        run: python3 -m pytest -q scripts/archive/test_nbm.py
      - name: Backfill
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          RANGE: ${{ inputs.range }}
          HOURS: ${{ inputs.hours }}
        run: |
          python3 scripts/archive/nbm.py work --range "$RANGE" --hours "$HOURS" 2>&1 | tee log.txt
          exit ${PIPESTATUS[0]}
      - name: Start the next chunk
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ inputs.range }}
          HOURS: ${{ inputs.hours }}
        run: |
          if grep -q "BACKFILL COMPLETE" log.txt; then echo "range $RANGE done"; exit 0; fi
          gh api -X POST repos/${{ github.repository }}/actions/workflows/nbm-backfill.yml/dispatches -f ref=main \
            -f "inputs[range]=$RANGE" -f "inputs[hours]=$HOURS"
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${runUrl}\n\nNBM backfill (range ${{ inputs.range }}) failed and its chain stopped. Nothing from the failing cycle was archived; re-dispatch the same range to resume (done markers).`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "nbm-backfill-failure" });
            if (existing.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: "NBM backfill failed", body, labels: ["nbm-backfill-failure"] });
            }
