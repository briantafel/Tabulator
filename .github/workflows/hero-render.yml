name: Hero mountain render (one-off)

# Marketing storyboard frames: a real mountain as a white plaster model, rendered in
# Blender (Cycles, CPU). Manual. Publishes PNGs to the `hero-frames` branch.
on:
  workflow_dispatch:
    inputs:
      lat: {default: "43.7410"}
      lon: {default: "-110.8024"}
      half_km: {default: "6.5"}
      grid: {default: "900"}
      samples: {default: "96"}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Elevation
        run: |
          pip install -q rasterio numpy
          mkdir -p work out
          python3 scripts/hero/dem.py work/height ${{ inputs.lat }} ${{ inputs.lon }} ${{ inputs.half_km }} ${{ inputs.grid }}
          cp work/height.json out/meta.json
      - name: Blender
        run: |
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 >/dev/null || echo "apt install failed; Blender will say what is missing"
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz
          SAMPLES=${{ inputs.samples }} ./blender-4.2.3-linux-x64/blender -b -P scripts/hero/render.py -- work/height.npy work/height.json out 2>&1 | grep -vE "^Fra:|Sample" | tail -40; test ${PIPESTATUS[0]} -eq 0
          ls -la out
          test -f out/01-hero-light.png
      - name: Publish to the hero-frames branch
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b hero-frames
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Hero frames from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hero-frames
