name: Verify forecasts

# Builds the verification table: every archived forecast paired with what
# fell (SNOTEL), plus scores by source, lead day and region.
# See scripts/verify/build.py and claude/verification-table-plan.md.
#
# The repo and its Action logs are PUBLIC; the table includes paid-source
# rows. So: the table and scores go only to the private bucket (verify/), the
# log shows public-safe counts only, and the readable report is uploaded as
# an artifact ENCRYPTED to scripts/verify/report-key.pub.pem (the private
# key lives only in Claude's workspace).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/verify/**", "scripts/model/**", ".github/workflows/verify.yml"]
  # scheduled by workers/scheduler (Cloudflare); GitHub cron removed 2026-11-23

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 2026-11-21: + long-range scoring of the past-winter ensembles
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install duckdb==2.0.0 "numpy>=2,<3"

      - name: Test the builder and the SLR fit
        run: |
          python3 scripts/verify/test_build.py
          python3 scripts/verify/test_longrange.py
          python3 scripts/model/test_slr.py
          python3 scripts/model/test_blend.py
          python3 scripts/model/test_bands.py
          python3 scripts/model/test_temps.py
          python3 scripts/model/test_ensmean.py

      - name: Download the archive
        run: |
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 sync "s3://$R2_BUCKET/archive/" archive/ --endpoint-url "$ENDPOINT" --only-show-errors
          echo "archive: $(find archive -name '*.parquet' | wc -l) files, $(du -sh archive | cut -f1)"

      - name: Build the table
        run: |
          python3 scripts/verify/build.py archive out
          cat out/log.txt >> "$GITHUB_STEP_SUMMARY"

      # Fit on 2024-25, judge on 2025-26. Results go only into the sealed report.
      - name: Fit and judge SLR v1
        run: python3 scripts/model/slr.py out/pairs.parquet out

      # Corrected, lead-weighted model blend: fit 2024-25, judge 2025-26. Sealed report only.
      - name: Fit and judge blend v1
        run: python3 scripts/model/blend.py out/pairs.parquet out

      # Likely / possible bands for our blend from our own past misses (2026-11-18).
      # Fit 2024-25, judge coverage on 2025-26. Public models + public truth only.
      - name: Fit and judge bands v1
        run: python3 scripts/model/bands.py out/pairs.parquet out | tee -a "$GITHUB_STEP_SUMMARY"

      # Temperature model: per-resort high correction + lead weights. Fit 2024-25, judge 2025-26.
      - name: Fit and judge the temperature model
        run: python3 scripts/model/temps.py out/temp_pairs.parquet out

      # Daily digest (Brian, 2026-11-12): temps vs paid, snowfall hit rates, wind by
      # station height — by region and lead day. Contains paid scores: sealed report only.
      - name: Daily accuracy digest
        run: python3 scripts/verify/digest.py archive out

      # Long range (Brian, 2026-11-21): every ensemble scored out to day 15 against what fell,
      # past winters included (read from the archive month by month). Public models +
      # public truth only, so the report is published unsealed below. Runs after the
      # digest and may not block the save; a failure turns the run red at the end.
      - name: Long-range verification (days 0-15)
        id: longrange
        continue-on-error: true
        run: python3 scripts/verify/longrange.py archive out

      # Ensemble-mean water corrected on every past winter (Brian, 2026-11-22: "score five past
      # winters instead of one"). Reads longrange's per-resort-day ensemble means BEFORE they are
      # deleted below. Public models + public truth only; nothing reads it in the app.
      - name: Ensemble-mean water (past winters)
        id: ensmean
        if: steps.longrange.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/model/ensmean.py out

      - name: Save to the bucket
        if: success()
        run: |
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          DAY=$(date -u +%Y-%m-%d)
          rm -rf out/longrange_tmp
          aws s3 cp out/ "s3://$R2_BUCKET/verify/$DAY/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp out/ "s3://$R2_BUCKET/verify/latest/" --recursive --endpoint-url "$ENDPOINT" --only-show-errors
          echo "saved to verify/$DAY/ and verify/latest/"

      # Always, so a failed build still hands Claude its diagnostics (sealed).
      - name: Encrypt the report
        if: always()
        run: |
          mkdir -p sealed out
          find out -maxdepth 1 -type f ! -name '*.parquet' -printf '%f\n' > files.txt
          tar czf report.tgz -C out -T files.txt
          KEY=$(openssl rand -hex 32)
          export KEY
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in report.tgz -out sealed/report.tgz.enc
          printf '%s' "$KEY" | openssl pkeyutl -encrypt -pubin -inkey scripts/verify/report-key.pub.pem \
            -pkeyopt rsa_padding_mode:oaep -out sealed/key.enc
          rm report.tgz

      # Public-only reports (2026-11-19): blend, bands and temps use public models
      # and public truth only (see each script's docstring), so they go to the log,
      # the job summary and an unsealed artifact. Claude can read them without a
      # decrypt. Anything with paid scores (report.md, digest, slr) stays sealed.
      - name: Print the public-only reports
        if: always()
        run: |
          mkdir -p public-report
          for f in blend_report.md bands_report.md temps_report.md longrange_report.md ensmean_report.md; do
            [ -f "out/$f" ] || { echo "::warning::out/$f missing"; continue; }
            if grep -qi "snow-forecast\|(paid)" "out/$f"; then
              echo "::error::out/$f mentions a paid source; not publishing it"; exit 1
            fi
            cp "out/$f" public-report/
            echo "===== $f ====="; cat "out/$f"
            { echo; cat "out/$f"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report-public
          path: public-report/
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report-sealed
          path: sealed/
          retention-days: 7

      - name: Fail loudly if long-range scoring failed
        if: always() && (steps.longrange.outcome == 'failure' || steps.ensmean.outcome == 'failure')
        run: |
          echo "::error::Long-range or ensemble-mean verification failed — see the step logs. The rest of the report was saved."
          exit 1
