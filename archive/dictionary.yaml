# The forecast archive's data dictionary.
#
# The one place a column, source or variable's meaning is written down.
# Copied to the bucket root on every run, so the archive describes itself.
# Started 2026-10-29. See archive/README.md for layout and how to query it.

conventions:
  storage: Metric units and UTC timestamps. Inches, °F and local time exist only in views and the app.
  missing: An absent value is no row at all, never a zero.
  append_only: Nothing is edited. A corrected parse is new rows with a newer parser_version.
  duplicates: >
    Observation windows overlap between runs on purpose, so the same reading can
    appear more than once. Views keep the newest fetched_at per
    (source, station_id, valid_start, variable).
  lead_time: Not stored. Computed in views as valid_start minus issued_at, or minus fetched_at where issued_at is null.

columns:
  source: Which source produced the row. One of the keys under `sources`.
  kind: forecast | observation | hindcast (a source's model record of past weather — not a forecast, not a measurement) | mapping (a resort-to-station candidate, see snotel).
  resort_id: Tabulator's own resort ID from src/data/resorts.json. Null on station observations.
  tier: top | mid | bot for Snow-Forecast; mid for the ensembles (requested at Snow-Forecast's mid elevation); null otherwise.
  elevation_m: Height the value is for, in metres, as the source states it.
  lat: Latitude of the point the source answered for.
  lon: Longitude of the point the source answered for.
  station_id: The source's own key for the location. Snow-Forecast URL slug (two joined with + where the app combined them), or a SNOTEL station triplet.
  issued_at: When the source says the forecast was issued. Null where the source does not say.
  fetched_at: When the archive fetched it. GitHub often runs scheduled jobs late, so this can trail the schedule by hours.
  valid_start: Start of the period the value describes (UTC). For an instant reading, valid_start = valid_end.
  valid_end: End of that period (UTC).
  period_label: The source's own label for the period, verbatim (am, pm, night, hourly, daily).
  variable: What was measured or forecast. Defined under `variables`.
  value: Numeric value, in `unit`.
  value_text: Text value — phrases, prose summaries, directions, resort-reported figures kept verbatim.
  unit: Unit of `value`. Always metric.
  model: Weather model, for multi-model sources.
  member: Ensemble member. 0 is the control run.
  run_id: Ties a row to its run and its raw files ("2026-10-29T0645Z-<GitHub run id>", or "git-<sha>" for the backfill).
  parser_version: Which code produced the row.

sources:
  snow-forecast:
    name: Snow-Forecast.com 6-day forecast
    kind: forecast (the spine) plus resort-reported observations
    url: https://www.snow-forecast.com/resorts/{slug}/6day/{top|mid|bot}
    cadence: twice daily
    since: 2026-10-29 at all three tiers; mid tier back to 2026-08-21 via the git backfill
    raw: every page, gzipped HTML
    notes:
      - issued_at is the page's own "Issued:" time (resort-local, converted to UTC) from parser_version sf-archive-2 on; null before that and wherever the page does not state it.
      - >
        Periods are labelled AM / PM / night in the resort's local time without
        stated hours. valid_start/valid_end ASSUME AM 06–12, PM 12–18, night
        18–06. period_label is verbatim, so windows can be recomputed.
      - >
        Backfill rows tagged parser_version git-json-pre-2026-10-28 came from a
        parser that could put every value one period off its time label.
        Treat them as approximate.
      - The backfill holds only mid tier, only runs whose forecast changed, and nothing from 2026-08-25 to 2026-10-28 (scrape paused).
  open-meteo-ensemble:
    name: Open-Meteo Ensemble API
    kind: forecast
    url: https://ensemble-api.open-meteo.com/v1/ensemble
    models:
      ecmwf_ifs025: ECMWF IFS ensemble, 0.25°, 51 members
      gfs025: NOAA GFS ensemble, 0.25°, 31 members
    cadence: twice daily, out to 16 days
    since: 2026-10-29
    raw: every response, hourly, gzipped JSON
    notes:
      - Rows are 6-hour blocks starting 00/06/12/18 UTC, built from the hourly raw. A block is written only when all six hours are present.
      - Requested at the resort's Snow-Forecast mid-tier elevation, so temperatures are downscaled to the same height as the spine.
      - A model that does not offer a variable (the ECMWF ensemble has no freezing level) simply has no rows for it; each run's manifest lists what was unavailable.
      - Free tier is for non-commercial use. A commercial Tabulator would need a paid Open-Meteo plan.
      - >
        Changes, 2026-11-10/11. Compare sources only on resort-days both have.
        From 2026-11-11 archiveOnly resorts get no ensembles. gfs025 is paused
        (claude/lean-data-plan.md Phase 0). Requests went from 5 to 11 variables
        on 2026-11-10 (9d0510c), then back to 5 on 2026-11-11 (21643bb), so the
        SLR variables (rh, 700 hPa) exist only for the runs in between. The
        01:28Z 2026-11-11 run is missing (cancelled, nothing uploaded). The
        12:22Z run has 10 resorts (rate limited).
  dwd-icon-eps:
    name: DWD ICON ensembles from opendata.dwd.de (free; files kept ~24 h)
    kind: forecast
    url: https://opendata.dwd.de/weather/nwp/
    models:
      icon-eu-eps: ICON-EU-EPS, ~13 km icosahedral, 40 members, 00z+12z to 120 h
      icon-d2-eps: ICON-D2-EPS, 2.2 km icosahedral, 20 members, 03z+15z to 48 h (no wind archived)
    cadence: workflow regional-eps.yml every 3 h; collects every complete run not yet archived (markers under regional/done/)
    since: 2026-11-11
    raw: not kept (GBs per run); only resort points
    notes:
      - Each resort uses the nearest grid cell within the domain (EU 25 km, D2 5 km). elevation_m, lat and lon are that cell's own values, NOT the resort's. Temperatures are at the model's height, not downscaled.
      - Rows are 6-hour blocks aligned to 00/06/12/18 UTC (precip, snow_we, temp_min, temp_max, wind_speed_max). Blocks only partly covered by the run are not written.
      - issued_at is the exact model run time. snow_we is the model's snowfall as water equivalent (snow_gsp + snow_con), mm.
      - "Licence: DWD open data, attribution Deutscher Wetterdienst."
      - "Upper-air profiles (parser regional-eps-profile-1, from 2026-11-11; run_id contains -prof-): INSTANT rows (valid_start == valid_end, period_label instant) at 00/06/12/18 UTC, EU to 72 h, D2 to 48 h. D2: t/rh/z at 1000/950/850/700/500 hPa. EU: t and z at 850 and 500 hPa only (no humidity on pressure levels). Names t_<p>hpa (°C), rh_<p>hpa (%), z_<p>hpa (m, geopotential / 9.80665). Raw model values at the cell; per-tier interpolation and wet-bulb are derived later (claude/upper-air-plan.md). Instants are excluded from the verification table (valid_end > valid_start)."
  meteoswiss-icon-eps:
    name: MeteoSwiss ICON-CH ensembles, Open Government Data via STAC (free; files kept 24 h)
    kind: forecast
    url: https://data.geo.admin.ch/api/stac/v1/search
    models:
      icon-ch1-eps: ICON-CH1-EPS, ~1 km, control (member 0) + 10 perturbed, 00z+12z to 33 h
      icon-ch2-eps: ICON-CH2-EPS, ~2.1 km, control (member 0) + 20 perturbed, 00z+12z to 120 h
    cadence: workflow regional-eps.yml every 3 h, as above
    since: 2026-11-11
    raw: not kept; only resort points
    notes:
      - Same row shape as dwd-icon-eps. MeteoSwiss does not publish SNOW_CON, so snow_we is grid-scale snow only.
      - "Licence: MeteoSwiss Open Government Data. Cite: Source: MeteoSwiss."
      - "Profile pass (parser regional-eps-profile-1, from 2026-11-11): freezing_level (HZEROCL) and snow_limit (SNOWLMT), m above sea level, INSTANT rows at 00/06/12/18 UTC, when the STAC offers them. Fill values (≤ −900, and 9999 = no 0 °C level / no snow limit) are dropped, not stored. The STAC offers T, QV, P, U, V, W on model levels only (no RELHUM, no FI, no pressure levels; checked 2026-11-11), so a full Swiss profile would need model-level files plus HHL."
  dynamical-ens:
    name: Global ensembles from dynamical.org (Icechunk/Zarr on AWS; free, no quota)
    kind: forecast
    url: https://dynamical.org/catalog/
    models:
      ecmwf_ifs_ens: ECMWF IFS ENS 0.25°, 51 members, 00z, to 360 h (dataset ecmwf-ifs-ens-forecast-15-day-0-25-degree; history from 2024-04-01)
      gefs: NOAA GEFS 0.25°, 31 members, 00z, first 384 h kept (dataset noaa-gefs-forecast-35-day; history from 2020-10-01)
      ecmwf_aifs_ens: ECMWF AIFS ENS 0.25°, 51 members, 00/06/12/18z, to 360 h (dataset ecmwf-aifs-ens-forecast; history from 2025-07-02)
    cadence: workflow dynamical-ens.yml every 3 h; collects every init in the last 3 days not yet archived (markers under dynamical/done/)
    since: 2026-11-11
    raw: not kept (dynamical.org keeps the history; re-readable)
    notes:
      - Nearest 0.25° grid cell to the resort. lat/lon are the cell's. elevation_m is the cell's APPROXIMATE height from surface vs sea-level pressure (hypsometric, roughly ±50 m). Temperatures are at the model's height, not downscaled.
      - precipitation_surface is a mean rate over the interval ending at each lead (kg m-2 s-1), so mm = rate × seconds. 6-hour blocks aligned to 00/06/12/18 UTC. Partial blocks are not written.
      - "Variables: precip, temp_min, temp_max, wind_speed_max; ECMWF also temp_850_mean, temp_925_mean, dewpoint_2m_mean (and gust_max for IFS); GEFS also rh_2m_mean and frozen_pct_mean (NCEP's -50 no-precipitation code dropped, so no precip means no row)."
      - "From 2026-11-11: temp = 2 m temperature at each lead on a 3-hour boundary out to 240 h (period_label instant, valid_start = valid_end). 3-hourly where the model is (IFS ENS to 144 h, GEFS), 6-hourly where it is not (AIFS ENS, IFS ENS after 144 h). For lift-hours lows (claude/temp-wind-plan.md T2). History inits archived before this change have no temp rows."
      - Treat this as a separate source from open-meteo-ensemble's ecmwf_ifs025 (same model, different processing). Never merge them.
      - "Licence: CC BY 4.0 via dynamical.org; ECMWF data also under ECMWF's terms. Attribution: ECMWF IFS ENS / AIFS ENS / NOAA GEFS from dynamical.org."
  nbm:
    name: NOAA National Blend of Models, CONUS 2.5 km (AWS noaa-nbm-grib2-pds)
    kind: forecast (and the US baseline to beat)
    url: https://noaa-nbm-grib2-pds.s3.amazonaws.com
    models:
      nbm: NBM core (deterministic, calibrated blend), 00z+12z cycles to 264 h
    cadence: workflow nbm.yml every 3 h; collects every 00z/12z cycle in the last 3 days not yet archived (markers under nbm/done/)
    since: 2026-11-11
    raw: not kept (NOAA keeps NBM on AWS; byte ranges are re-readable)
    notes:
      - Nearest grid point within 3 km. That covers the 56 US and Canadian resorts (CONUS grid reaches southern Canada). lat/lon are the grid point's. elevation_m is null.
      - "6-hour blocks aligned to 00/06/12/18 UTC: precip = APCP 6 h acc (mm); snow = ASNOW 6 h acc (cm), NBM's own snow-to-liquid; temp_min/max and wind_speed_max from the 2 m TMP / 10 m WIND instants inside the block (3-hourly, so min/max of 2–6 instants)."
      - Only deterministic idx lines are used. Probability, percentile and std-dev messages share the variable names and are skipped by design.
      - "Licence: NOAA open data, no restrictions. Attribution: NOAA National Blend of Models."
      - "parser nbm-2 (2026-11-11): snow_level_min/max (m above sea level) from NBM's snow level at the block's instants, and slr_mean (ratio) when the inventory has a snow-to-liquid ratio. The idx names are matched by pattern (unverified from the sandbox); a cycle with no snow level is archived but the run fails loudly and prints the related inventory lines."
  noaa-hrrr:
    name: NOAA HRRR 3 km, pressure-level file wrfprs (AWS noaa-hrrr-bdp-pds)
    kind: forecast (upper-air profiles only; no precipitation rows)
    url: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
    models:
      hrrr: HRRR CONUS, 00/06/12/18z to 48 h, leads every 6 h
    cadence: workflow upper-air.yml every 3 h; every cycle in the last 3 days not yet archived (markers under upper-air/done/)
    since: 2026-11-11
    raw: not kept (NOAA keeps HRRR on AWS from 2014; byte ranges are re-readable, so it can be backfilled with --cycle)
    notes:
      - "Profile rows (parser upper-air-1; run_id contains -prof-): INSTANT rows (valid_start == valid_end, period_label instant) at 00/06/12/18 UTC. t_<p>hpa (°C), rh_<p>hpa (% over water), z_<p>hpa (m) at 1000, 950, 925, 900, 850, 800, 750, 700, 650, 600, 550, 500 hPa; psfc (hPa, model surface pressure at the cell; levels with p > psfc are below the model ground); freezing_level (m, HRRR's 0 °C isotherm height). Raw values at the nearest grid point within 3 km; elevation_m is that point's model terrain height. Per-tier interpolation and wet-bulb are derived later (claude/upper-air-plan.md). Instants are excluded from the verification table."
      - "Ridge-level wind (parser upper-air-2, from 2026-11-11; all three upper-air sources): wspd_850hpa / wspd_700hpa (km/h) and wdir_850hpa / wdir_700hpa (degrees the wind blows FROM, 0 = north), instants like the rest. Built from the model's u/v at that level; raw u/v are NOT stored. HRRR u/v are relative to its Lambert grid and are rotated to earth-relative first (angle = sin(38.5°) × (lon + 97.5°)); GEFS and ECMWF are on lat-lon grids, already earth-relative. 850 hPa ≈ 1.5 km and 700 hPa ≈ 3 km above sea level: compare a tier with the level nearest its elevation (z_<p>hpa gives the exact height). Free-air wind, not the wind at the snow surface, which terrain speeds up or shelters. For claude/temp-wind-plan.md W2/W3."
      - Coverage is the CONUS grid, which reaches southern Canada; its north edge is near 50.5°N in the BC interior, so northern BC/Alberta resorts are outside (the run log names them). Resorts close to the edge sit near the lateral boundary, where HRRR is least reliable.
      - "Licence: NOAA open data, no restrictions. Attribution: NOAA HRRR."
  noaa-gefs:
    name: NOAA GEFS 0.5° pressure-level file pgrb2a (AWS noaa-gefs-pds)
    kind: forecast (upper-air profiles only; no precipitation rows)
    url: https://noaa-gefs-pds.s3.amazonaws.com
    models:
      gefs: GEFS control (member 0) + 30 perturbed members, 00z+12z to 240 h, leads every 6 h
    cadence: workflow upper-air.yml every 3 h; every 00z/12z cycle in the last 3 days not yet archived
    since: 2026-11-11
    raw: not kept (NOAA keeps GEFSv12 on AWS from 2020-09; backfillable with --cycle). Same file layout as the GEFSv12 reforecast 2000–2019 (training set).
    notes:
      - "Same row shape as noaa-hrrr. Levels 1000, 925, 850, 700, 500 hPa (all that pgrb2a carries in 1000–500). rh is over water. psfc and elevation_m (the cell's model orography) per cell. Nearest 0.5° cell within 40 km; global, so all resorts."
      - Separate from dynamical-ens's GEFS (that one has surface fields and no pressure-level T/RH). Never merge them.
      - "Licence: NOAA open data, no restrictions. Attribution: NOAA GEFS."
  ecmwf-opendata:
    name: ECMWF open data, IFS 0.25° (AWS ecmwf-forecasts)
    kind: forecast (upper-air profiles only; no precipitation rows)
    url: https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com
    models:
      ifs-hres: IFS deterministic (stream oper), 00z+12z, leads every 6 h to 156 h then every 12 h to 240 h
      ifs-ens: IFS ENS (stream enfo), control (member 0) + 50 members, 00z, same leads. Archived in 6-lead chunks (run_id …-prof-c<i>-…, markers ifs-ens-<cycle>-c<i>), ~3 GB of downloads each
    cadence: workflow upper-air.yml every 3 h; every cycle in the last 3 days not yet archived
    since: 2026-11-11
    raw: not kept (the AWS bucket keeps open data from 2024; backfillable with --cycle)
    notes:
      - "Same row shape as noaa-hrrr. Levels 1000, 925, 850, 700, 600, 500 hPa. psfc per cell; elevation_m is null (the open set has no orography at these steps). Nearest 0.25° cell within 20 km; global."
      - "rh_<p>hpa is IFS's own r: over WATER above 0 °C, over ICE below −23 °C, with IFS's quadratic blend between (alpha = ((T + 23) / 23)^2). It can exceed 100 % in cold air (126 % seen at 500 hPa), and very dry air can show small negatives, −2.7 % seen (GRIB packing noise; stored as published; gate at −5 %). Convert back to vapour pressure with the same blend before computing wet-bulb. q_<p>hpa (g/kg) is stored only for a level that has no r."
      - Separate from dynamical-ens's IFS ENS (no humidity aloft there). Never merge them.
      - "Licence: ECMWF open data, CC BY 4.0. Attribution: Source: ECMWF."
  snotel:
    name: NRCS SNOTEL via the AWDB REST API
    kind: observation (ground truth for US resorts) and mapping
    url: https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1
    cadence: twice daily; each run takes the last 36 hours hourly and the last 3 days daily. A one-time backfill (run_id bf-snotel-<year>, parser_version snotel-history-1, workflow backfill.yml) adds daily readings for Nov–Apr of 2024-25 and 2025-26. Hourly TOBS for the same winters comes from monthly pieces snotel-hourly-temp-<yyyy-mm> (run_id bf-snotel-hourly-temp-<yyyy-mm>, added 2026-11-11 for lift-hours lows): same rows as the live hourly collector (variable temp, °C, period_label hourly, valid_start = valid_end = the reading hour in UTC).
    since: 2026-10-29
    raw: station list and every data response, gzipped JSON
    notes:
      - >
        Stations are not at the resorts. Every run records up to three active
        stations within 30 km of each US resort (kind mapping, variable
        candidate_distance). Which one stands in for a resort is decided in the views.
      - AWDB reports English units in station-local standard time; rows are converted to metric and UTC.
      - No Canadian coverage; BC and the border Rockies use bc-asws below.

  slf:
    name: SLF Measurement API (WSL Institute for Snow and Avalanche Research), Switzerland
    kind: observation (ground truth for Swiss and nearby Alpine resorts) and mapping
    url: https://measurement-api.slf.ch/public/api
    cadence: in every archive run (twice daily); each run takes the last 3 of the 7 days the API serves
    since: 2026-11-11
    raw: station lists and every response, gzipped JSON
    notes:
      - "Two networks, in the model column. study-plot (manual, read by observers): snow_depth, new_snow_24h (cm, measured on a board), new_snow_water_24h (mm). imis (automatic): snow_depth at whole hours, and hn_1d_model, which is SLF's MODELLED 24 h new snow, never mixed with the measured value."
      - station_id is <network>:<code>. Up to 3 stations per network within 30 km of each resort are recorded as mapping rows (candidate_distance). The first run covered 12 resorts with 53 stations.
      - 24 h values have valid_start = measure_date − 24 h and valid_end = measure_date (UTC). Null fields write no row. A study plot answering 404 NO_DATA has no readings yet (early season), which is not a fault.
      - "Licence: CC BY 4.0. Cite: Source: WSL Institute for Snow and Avalanche Research SLF (IMIS DOI 10.16904/envidat.406)."
      - History older than 7 days comes from SLF file downloads (separate job, not built yet).
      - "From 2026-11-11 (parser slf-2): IMIS half-hourly weather from snow stations (SNOW_FLAT) and ridge wind stations (WIND, up to 3 more per resort; mapping value_text gives the station type). Variables wind_speed_mean and wind_gust_max (km/h, converted from m/s; the gust is the highest wind in the half hour), wind_dir_mean (deg), temp_mean (°C), period_label 30min, value_text = station type. For wind and slope-temperature verification by altitude (claude/temp-wind-plan.md W1/T1)."
  amedas:
    name: JMA AMeDAS (Japan Meteorological Agency automated stations)
    kind: observation (ground truth for Japanese resorts) and mapping
    url: https://www.jma.go.jp/bosai/amedas/ (const/amedastable.json, data/map/<YYYYMMDDHHmmss>.json)
    cadence: every archive run; snapshots at 03/09/15/21 JST (= 18/00/06/12 UTC) for the last 3 days
    since: 2026-11-11
    raw: the station table and each snapshot, gzipped JSON
    variables: snow_depth (cm, instant), new_snow_6h and new_snow_24h (cm, depth increase over the window ending valid_end; JMA snow6h/snow24h), precip_24h (mm; heated gauge, undercatches snow), temp (°C, instant)
    licence: "Government of Japan Standard Terms of Use (CC BY 4.0 compatible). Credit: Japan Meteorological Agency website."
    notes:
      - Only quality flag 0 is kept. Stations within 30 km that report snow depth; up to 3 per resort as mapping rows.
      - Stations are in valleys and towns, often far below the slopes; elevation_m is the station's.
  cocorahs:
    name: CoCoRaHS (Community Collaborative Rain, Hail and Snow Network)
    kind: observation (volunteer daily reports, US and Canada) and mapping
    url: https://data.cocorahs.org/export/exportreports.aspx and exportstations.aspx (CSV, times in GMT)
    cadence: every archive run, the last 3 report dates
    since: 2026-11-11
    raw: each station list and report CSV, gzipped
    variables: precip_24h (mm), new_snow_24h (cm), new_snow_water_24h (mm), snow_depth (cm, instant), swe (mm, instant)
    licence: "Free for non-commercial use with credit: Community Collaborative Rain, Hail and Snow Network (CoCoRaHS)."
    notes:
      - A report covers ~24 h ending at its observation time (often ~7 am local); valid_end is that time in UTC.
      - T (trace) is stored as 0 with value_text T. NA writes no row. Inches are converted to metric.
      - Up to 5 stations within 30 km per resort as mapping rows. Volunteers live in towns and valleys, below the slopes.
  snodas:
    name: NOAA NOHRSC SNODAS (Snow Data Assimilation System), NSIDC G02158 unmasked
    kind: analysis (gridded ~1 km snowpack analysis; second-tier truth)
    url: https://noaadata.apps.nsidc.org/NOAA/G02158/unmasked/YYYY/MM_Mon/SNODAS_unmasked_YYYYMMDD.tar
    cadence: every archive run, the last 3 days
    since: 2026-11-11
    raw: each product's text header, gzipped (the grids are not kept)
    variables: snow_depth (cm), swe (mm), snowfall_water_24h (mm water, solid precipitation), rain_24h (mm); each also as <name>_max_5x5 (max of the 5x5 cells, ~4 km, around the resort)
    licence: Public domain (US Government). Cite NOAA NOHRSC SNODAS, NSIDC G02158.
    notes:
      - A model analysis blended with observations, not a measurement. Weaker outside the US (the unmasked grid reaches southern Canada).
      - Snapshot 06 UTC on the file date; precipitation products are 24 h ending then.
      - Grid size, corners and scale come from each file's header ("Meters / 1000", "Kilograms per square meter / 10"); a plausibility gate fails the run on bad scaling.
  bc-asws:
    name: BC Automated Snow Weather Stations (BC River Forecast Centre snow pillows)
    kind: observation (ground truth for BC and border-Rockies resorts) and mapping
    url: https://www.env.gov.bc.ca/wsd/data_searches/snow/asws/data/{SW,SD,PC,TA}.csv (current water year) and {code}_Archive.csv (earlier years); stations from the BC WFS layer WHSE_WATER_MANAGEMENT.SSL_SNOW_ASWS_STNS_SP
    cadence: twice daily, the last 72 hours hourly. A one-time backfill (piece bc-asws-history, run_id bf-bc-asws-history, parser_version bc-asws-history-1, workflow backfill.yml) adds hourly readings 2024-10-25 → 2026-05-02.
    since: 2026-11-10
    raw: the station layer (GeoJSON) and each CSV as fetched, gzipped
    variables: swe (mm), snow_depth (cm), precip_accum (mm, cumulative gauge), temp (°C); period_label hourly, valid_start = valid_end = the reading's UTC hour
    licence: Open Government Licence – British Columbia (attribution)
    notes:
      - Same mapping pattern as snotel - up to three active stations within 30 km of each Canadian resort (kind mapping, variable candidate_distance); the views pick one per tier.
      - Wide CSVs, one column per station, hours in UTC. Blank cells are missing (no row). Values outside a per-variable sensor range are dropped and counted; a shift in the overall range (a unit change) fails the run.
      - The verification build turns hours into days - a day's reading is the median of 23:00, 00:00 and 01:00 local around its midnight, so a day's gain is reading(next day) minus reading(day).
      - Snow pillows are noisy hour to hour (a few mm); daily gains below ~3 mm are within that noise.

  nws:
    name: US National Weather Service gridpoint forecast
    kind: forecast
    url: https://api.weather.gov/gridpoints/{office}/{x},{y} (found from each resort's `nws` point via /points)
    cadence: twice daily
    since: 2026-10-29 (second archive patch)
    raw: every gridpoint response, gzipped JSON
    notes:
      - issued_at is the gridpoint's own updateTime — the only source here that states when its forecast was made.
      - Each value has its own window (validTime), from one hour to several days. Rows keep those windows as given.
      - US resorts only. station_id is the grid cell, office/x,y.
  onthesnow:
    name: OnTheSnow resort snow report, skier reports and monthly history
    kind: observation (and its own daily snow forecast, kind forecast)
    url: https://www.onthesnow.com/{otsPath}/skireport, /ski-report-reviews, /historical-snowfall
    cadence: twice daily (snow report, skier reports); one-time (monthly history, run_id bf-ots-history-<resort>, workflow backfill.yml)
    since: 2026-10-29. Snow report parsed into rows from parser_version ots-2; earlier captures that day are raw only.
    raw: every page, gzipped HTML
    notes:
      - >
        reported_daily_snow is the resort's own figure for each calendar day
        (resort-local), from the report's rolling 8-day list. Every capture is
        kept, so each day appears in up to eight captures. The verification
        table uses the figure as reported the FOLLOWING day — after the resort
        has settled it — and a later capture only if that one is missing.
      - issued_at on snow-report rows is the report's own last-modified time.
      - OnTheSnow's daily snow forecast is kept as source onthesnow, kind forecast, variable snow.
      - The monthly history has no daily figures. It is a scale check, not a daily truth.
      - Skier reports are parsed into rows (text, photo URL). Reporter names are not archived.
      - Covers all 40 resorts, including the four Canadian ones. Resort figures are self-reported and unaudited.
  open-meteo-previous-runs:
    name: Open-Meteo Previous Runs API (one-time backfill)
    kind: forecast
    url: https://previous-runs-api.open-meteo.com/v1/forecast
    models:
      ecmwf_ifs025: ECMWF IFS, 0.25°, deterministic
      gfs_seamless: NOAA GFS, deterministic
    coverage: Nov–Apr of 2024-25 and 2025-26, every resort, run_id bf-om-<resort>-<model>-<year>, workflow backfill.yml (resumable, a share of the free daily allowance per night)
    notes:
      - What each model forecast for each past hour from the runs 0–7 days before it. 6-hour blocks like the ensembles.
      - period_label is the source's own lead label (previous_day0 … previous_day7) and is exact. issued_at is APPROXIMATE (valid_start minus that many days); the archive has no exact run time for these.
      - Snowfall, precipitation and temperature only, to stay inside the free tier's limits.
  snow-forecast-hindcast:
    name: Snow-Forecast.com hindcast ("Past Weather"), subscriber-only
    kind: hindcast
    url: https://www.snow-forecast.com/resorts/{slug}/hindcasts/{yyyy-mm-dd}/{tier}
    coverage: pulled by hand in Brian's logged-in Chrome (scripts/archive/sf-hindcast-runner.browser.js), imported automatically by the next Archive forecasts run after a file lands in the bucket's imports/ folder. First pull planned — the last two winters, mid tier. Available back to 2007.
    raw: the imported file itself, kept under raw/source=snow-forecast-hindcast/imported/
    notes:
      - Snow-Forecast's own model record of what happened, per AM / PM / night period. Not what it forecast days ahead, and not a measurement. Its use is comparison against SNOTEL — where Snow-Forecast runs high or low at each resort.
      - Subscriber data. Lives only in the private bucket; never committed to the public repo or shared.
      - Same period-hour assumption as snow-forecast (AM 06–12, PM 12–18, night 18–06 local).

variables:
  snow: { unit: cm, meaning: New snowfall over the valid period. Snow-Forecast prints an em-dash for none; stored as 0. NWS gives it in mm and is converted. }
  rain: { unit: mm, meaning: Rain over the valid period (Snow-Forecast). }
  precip: { unit: mm, meaning: Total precipitation, liquid equivalent, over the valid period (ensembles). }
  temp_max: { unit: C, meaning: Maximum air temperature over the period. }
  temp_min: { unit: C, meaning: Minimum air temperature over the period. }
  wind_chill: { unit: C, meaning: Snow-Forecast's wind-chill temperature. }
  humidity: { unit: "%", meaning: Relative humidity (Snow-Forecast). }
  freezing_level: { unit: m, meaning: Height of the 0 °C level above sea level, as Snow-Forecast gives it per period. }
  freezing_level_min: { unit: m, meaning: Lowest freezing level in the 6-hour block (ensembles). }
  wind_speed: { unit: km/h, meaning: Wind speed for the period (Snow-Forecast). }
  wind_speed_max: { unit: km/h, meaning: Highest hourly 10 m wind speed in the block (ensembles). }
  wind_dir: { unit: null, meaning: Wind direction as a compass point, text. }
  "wspd_<p>hpa": { unit: km/h, meaning: "Free-air wind speed at pressure level p (850 or 700 hPa) from the model's u/v; upper-air sources, instants." }
  "wdir_<p>hpa": { unit: deg, meaning: "Direction the wind at pressure level p blows FROM, degrees clockwise from north, earth-relative." }
  phrase: { unit: null, meaning: Snow-Forecast's short forecast phrase for the period, verbatim. }
  summary_next3: { unit: null, meaning: Snow-Forecast's prose forecast for the next three days, verbatim. }
  summary_days4_6: { unit: null, meaning: Snow-Forecast's prose forecast for days 4–6, verbatim. }
  "reported_*": { unit: null, meaning: Snow-Forecast's resort-reported figures (top/bottom depth, fresh snow, last snowfall), verbatim text. }
  "history_*": { unit: null, meaning: Snow-Forecast's powder-day counts, verbatim text. }
  snow_depth: { unit: cm, meaning: Snow depth on the ground at a SNOTEL station. }
  swe: { unit: mm, meaning: Snow water equivalent at a SNOTEL station — the water in the snowpack. }
  temp: { unit: C, meaning: Air temperature — observed at a SNOTEL station, or forecast by NWS for its window. }
  precip_accum: { unit: mm, meaning: Precipitation accumulated since the water year began (1 October), SNOTEL. }
  candidate_distance: { unit: km, meaning: Distance from a resort's mountain point to a nearby SNOTEL station (kind mapping). value_text is the station name. }
  reported_new_snow: { unit: cm, meaning: Snow-Forecast's resort-reported fresh snowfall, as a number. Only written when the page gives a figure in cm; "—" stays text-only in reported_fresh_snowfall_depth. As of fetched_at. }
  reported_top_depth: { unit: cm, meaning: Snow-Forecast's resort-reported upper-mountain snow depth. As of fetched_at. }
  reported_bottom_depth: { unit: cm, meaning: Snow-Forecast's resort-reported lower-mountain snow depth. As of fetched_at. }
  psfc: { unit: hPa, meaning: Surface pressure at the model's grid cell (upper-air sources). A pressure level with p > psfc lies below the model's ground there. }
  "t_<p>hpa": { unit: C, meaning: Temperature at pressure level p (instant). }
  "rh_<p>hpa": { unit: "%", meaning: Relative humidity at pressure level p (instant). Over water, except ecmwf-opendata (see its notes). }
  "q_<p>hpa": { unit: g/kg, meaning: Specific humidity at pressure level p (instant). }
  "z_<p>hpa": { unit: m, meaning: Geopotential height of pressure level p (instant). }
  snow_level: { unit: m, meaning: NWS snow level — the height above which precipitation falls as snow. }
  wind_gust: { unit: km/h, meaning: NWS forecast wind gust. }
  precip_probability: { unit: "%", meaning: NWS probability of precipitation for the window. }
  sky_cover: { unit: "%", meaning: NWS sky cover. }
  skier_report: { unit: null, meaning: A first-hand OnTheSnow skier report, verbatim text. valid_start is when it was posted. }
  skier_report_photo: { unit: null, meaning: The photo URL on that report. }
  wind_arrow_deg: { unit: deg, meaning: Rotation of Snow-Forecast's hindcast wind arrow, as drawn. Whether it points from or toward the wind is not yet confirmed — treat as a direction, not a bearing. }
  reported_daily_snow: { unit: cm, meaning: Resort-reported new snowfall for one resort-local calendar day (OnTheSnow). One row per day per capture; see the onthesnow notes for which capture counts. }
  reported_base_depth: { unit: cm, meaning: Resort-reported base depth, as of the report (OnTheSnow). }
  reported_mid_depth: { unit: cm, meaning: Resort-reported mid-mountain depth, as of the report (OnTheSnow). }
  reported_summit_depth: { unit: cm, meaning: Resort-reported summit depth, as of the report (OnTheSnow). }
  reported_last24: { unit: cm, meaning: Resort-reported new snow in the last 24 hours, as of the report. }
  reported_last48: { unit: cm, meaning: Resort-reported new snow in the last 48 hours. }
  reported_last72: { unit: cm, meaning: Resort-reported new snow in the last 72 hours. }
  report_status: { unit: null, meaning: The resort report's status text, verbatim. }
  reported_month_snow: { unit: cm, meaning: Resort-reported total snowfall for the month (OnTheSnow history). }
  reported_month_snow_days: { unit: days, meaning: Days with snowfall in the month (OnTheSnow history). }
  reported_month_biggest_snowfall: { unit: cm, meaning: Largest single snowfall in the month (OnTheSnow history). }
  reported_month_base_depth: { unit: cm, meaning: Average base depth for the month (OnTheSnow history). }
  reported_month_summit_depth: { unit: cm, meaning: Average summit depth for the month (OnTheSnow history). }
  reported_month_max_base_depth: { unit: cm, meaning: Maximum base depth in the month (OnTheSnow history). }
